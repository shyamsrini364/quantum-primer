[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-primer"
version = "0.1.0"
description = "Source-grounded quantum biology learning assistant"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic-settings>=2.6,<3",
  "langchain-openai>=0.3,<2", "langchain-text-splitters>=0.3,<2",
  "langgraph>=0.2,<2", "pinecone>=7,<8", "pypdf>=5,<7",
  "ebooklib>=0.18,<1", "beautifulsoup4>=4.12,<5", "rank-bm25>=0.2.2,<0.3",
  "tiktoken>=0.8,<1"
]
[project.optional-dependencies]
ui = ["streamlit>=1.40,<2"]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.9,<1"]
[project.scripts]
quantum-primer = "quantum_primer.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
